name:                lambdachan
version:             0.1.0.0
github:              "githubuser/lambdachan"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

description: A 4chan-style imageboard built with Servant and Persistent.

dependencies:
- base >= 4.7 && < 5
- aeson >= 2.0
- text
- bytestring
- time
- mtl
- transformers
- containers

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - servant >= 0.20
  - servant-server >= 0.20
  - wai
  - warp
  - persistent >= 2.14
  - persistent-sqlite >= 2.13
  - persistent-postgresql >= 2.13
  - persistent-template >= 2.12
  - password >= 3.0
  - uuid >= 1.3
  - monad-logger
  - resource-pool
  - cryptohash-sha256
  - base64-bytestring
  - http-types

executables:
  lambdachan-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - lambdachan

tests:
  lambdachan-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - lambdachan
    - hspec >= 2.0
    - hspec-wai >= 0.11
    - hspec-wai-json
    - QuickCheck
    - wai-extra
    - monad-logger
    - persistent
    - persistent-sqlite
    - uuid
    - wai
    - time
    - http-types
    - bytestring
